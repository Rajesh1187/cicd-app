apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cicd-clean
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Rajesh1187/cicd-clean-demo.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
