apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cicd-app
  namespace: argocd
spec:
  project: default

  source:
  repoURL: https://github.com/Rajesh1187/cicd-k8s-manifests.git
  targetRevision: main
  path: k8s
  kustomize: {}

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
