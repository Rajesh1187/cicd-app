apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cicd-app
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: backend=rajesh1187/cicd-backend,frontend=rajesh1187/cicd-frontend

    argocd-image-updater.argoproj.io/backend.update-strategy: newest-build
    argocd-image-updater.argoproj.io/frontend.update-strategy: newest-build

    argocd-image-updater.argoproj.io/backend.allow-tags: regexp:^\\d+$
    argocd-image-updater.argoproj.io/frontend.allow-tags: regexp:^\\d+$

    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-branch: main

spec:
  project: default

  source:
    repoURL: git@github.com:Rajesh1187/cicd-app.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
